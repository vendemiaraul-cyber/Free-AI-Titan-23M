# Free-AI-Titan-23M — Cloudflare edition (the browser UI + API + MCP)
name = "free-ai-titan-23m"
main = "cloudflare/src/index.js"
compatibility_date = "2025-09-01"
workers_dev = true

[ai]
binding = "AI"

[observability]
enabled = true

[vars]
TEACHER_MODEL = "@cf/openai/gpt-oss-120b"
PERCHANCE_URL = "https://perchance.org/rg4m14ri"
PUBLIC_CHAT = "true"
RECALL_THRESHOLD = "0.55"
# Answer "what is X" questions from Wikipedia before calling the cloud teacher
WEB_FIRST = "true"

# Titan's permanent memory (TITAN.md + reports). No id needed: Cloudflare creates the namespace on deploy.
[[kv_namespaces]]
binding = "KNOWLEDGE"
