# Free-AI-Titan-23M — Cloudflare Pages (the browser UI + API + MCP)
# public/_worker.js is the whole app (bundled from cloudflare/src by `npm run build`).
name = "free-ai-titan-23m"
pages_build_output_dir = "./public"
compatibility_date = "2025-09-01"

[ai]
binding = "AI"

[vars]
TEACHER_MODEL = "@cf/openai/gpt-oss-120b"
PERCHANCE_URL = "https://perchance.org/rg4m14ri"
PUBLIC_CHAT = "true"
RECALL_THRESHOLD = "0.55"

# Optional: keep TITAN.md and reports permanently in Workers KV (without it they live in memory).
# [[kv_namespaces]]
# binding = "KNOWLEDGE"
# id = "<your KV namespace id>"
